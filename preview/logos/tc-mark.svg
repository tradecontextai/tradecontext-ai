<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="256" height="256" role="img" aria-label="TradeContext.ai mark">
  <!--
    TradeContext.ai · Brand Mark (icon-only)
    Chart line ascending into a glowing endpoint — represents
    "context turning into signal". Cyan→violet gradient is the brand.
    Use on its own at favicon size, app icons, social avatars.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="36" x2="36" y2="0">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <polyline points="4,28 12,20 20,24 28,10" fill="none" stroke="url(#g)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="28" cy="10" r="3.8" fill="url(#g)"/>
  <circle cx="28" cy="10" r="1.7" fill="#fff"/>
</svg>
