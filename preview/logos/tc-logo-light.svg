<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 60" width="1080" height="180" role="img" aria-label="TradeContext.ai">
  <!--
    TradeContext.ai — primary logo lockup for LIGHT backgrounds.
    Wordmark in deep navy (#0a1628) instead of light grey so it stays
    readable on white / pale surfaces. Mark tile stays dark navy.
  -->
  <defs>
    <linearGradient id="brandGrad" x1="0" y1="60" x2="60" y2="0">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="tileBg" x1="0" y1="0" x2="48" y2="48">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0e1f3a"/>
    </linearGradient>
  </defs>

  <g transform="translate(6 6)">
    <rect width="48" height="48" rx="11" fill="url(#tileBg)"/>
    <rect width="48" height="48" rx="11" fill="none" stroke="rgba(14,165,233,0.42)" stroke-width="1.2"/>
    <g transform="translate(4.5 4.5) scale(1.083)">
      <polyline points="4,28 12,20 20,24 28,10" fill="none" stroke="url(#brandGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="28" cy="10" r="3.8" fill="url(#brandGrad)"/>
      <circle cx="28" cy="10" r="1.7" fill="#fff"/>
    </g>
  </g>

  <text x="68" y="41" font-family="Inter, -apple-system, 'Segoe UI Variable', 'Segoe UI', Roboto, system-ui, sans-serif" font-weight="900" font-size="34" letter-spacing="-1.3">
    <tspan fill="#0a1628">TradeContext</tspan><tspan fill="url(#brandGrad)">.ai</tspan>
  </text>
</svg>
