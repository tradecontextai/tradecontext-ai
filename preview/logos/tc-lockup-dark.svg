<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="720" height="160" role="img" aria-label="TradeContext.ai">
  <!--
    TradeContext.ai · Horizontal lockup (mark + wordmark) · for DARK backgrounds.
    Use on website headers, email signatures, slide decks, banners.
    Drop this directly into anything with a dark background (no fill needed).
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="80" x2="80" y2="0">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="68" y2="68">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0e1f3a"/>
    </linearGradient>
  </defs>

  <!-- Mark tile -->
  <g transform="translate(6 6)">
    <rect width="68" height="68" rx="16" fill="url(#bg)"/>
    <rect width="68" height="68" rx="16" fill="none" stroke="rgba(14,165,233,0.4)" stroke-width="1.5"/>
    <g transform="translate(7 7) scale(1.5)">
      <polyline points="4,28 12,20 20,24 28,10" fill="none" stroke="url(#g)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="28" cy="10" r="3.8" fill="url(#g)"/>
      <circle cx="28" cy="10" r="1.7" fill="#fff"/>
    </g>
  </g>

  <!-- Wordmark — TradeContext.ai (white "TradeContext" + gradient ".ai") -->
  <g font-family="Inter, -apple-system, 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="32" letter-spacing="-1.2">
    <text x="90" y="51" fill="#e2eaf4">TradeContext</text>
    <text x="296" y="51" fill="url(#g)">.ai</text>
  </g>
</svg>
