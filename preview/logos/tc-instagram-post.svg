<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" role="img" aria-label="TradeContext.ai · Instagram post">
  <!--
    TradeContext.ai — 1080×1080 square for Instagram feed post.
    Mark + 'TradeContext.ai' wordmark SIDE-BY-SIDE — exactly like the
    homepage navbar lockup. Branded navy + ambient aurora background.
  -->
  <defs>
    <linearGradient id="brandGrad" x1="0" y1="1080" x2="1080" y2="0">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="bgFill" x1="0" y1="0" x2="0" y2="1080">
      <stop offset="0%" stop-color="#03060d"/>
      <stop offset="100%" stop-color="#070d1a"/>
    </linearGradient>
    <linearGradient id="tileBg" x1="0" y1="0" x2="160" y2="160">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0e1f3a"/>
    </linearGradient>
    <radialGradient id="auraCyan" cx="18%" cy="0%" r="75%">
      <stop offset="0%"  stop-color="#0ea5e9" stop-opacity="0.22"/>
      <stop offset="65%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auraViolet" cx="88%" cy="12%" r="65%">
      <stop offset="0%"  stop-color="#8b5cf6" stop-opacity="0.20"/>
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auraGreen" cx="50%" cy="78%" r="55%">
      <stop offset="0%"  stop-color="#34d399" stop-opacity="0.06"/>
      <stop offset="80%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
  </defs>

  <!-- Background stack — same as the live homepage -->
  <rect width="1080" height="1080" fill="url(#bgFill)"/>
  <rect width="1080" height="1080" fill="url(#auraCyan)"/>
  <rect width="1080" height="1080" fill="url(#auraViolet)"/>
  <rect width="1080" height="1080" fill="url(#auraGreen)"/>
  <rect width="1080" height="1080" fill="url(#vignette)"/>

  <!-- ┌─ Horizontal lockup — mark + wordmark side by side, centred ─┐
       Shrunk to ~70% of canvas width so the brand background has more
       breathing room around it. Mark 110×110 + gap + wordmark @ 70px
       ≈ 700px total. Centred on 1080 canvas. -->
  <g transform="translate(190 485)">
    <!-- Mark tile (110×110) -->
    <g>
      <rect width="110" height="110" rx="25" fill="url(#tileBg)"/>
      <rect width="110" height="110" rx="25" fill="none" stroke="rgba(14,165,233,0.5)" stroke-width="2"/>
      <g transform="translate(10 10) scale(2.5)">
        <polyline points="4,28 12,20 20,24 28,10" fill="none" stroke="url(#brandGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="28" cy="10" r="3.8" fill="url(#brandGrad)"/>
        <circle cx="28" cy="10" r="1.7" fill="#fff"/>
      </g>
    </g>
    <!-- Wordmark — to the right of the tile, vertically centred against it. -->
    <text x="135" y="82" font-family="Inter, -apple-system, 'Segoe UI Variable', 'Segoe UI', Roboto, system-ui, sans-serif" font-weight="900" font-size="70" letter-spacing="-2.6">
      <tspan fill="#e2eaf4">TradeContext</tspan><tspan fill="url(#brandGrad)">.ai</tspan>
    </text>
  </g>
</svg>
